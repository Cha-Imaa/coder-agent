name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# Deployments must not overlap or cancel each other; the second one simply waits.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --extra docs --frozen

      # --strict turns every warning (a broken link, a page missing from the nav) into a red build.
      - run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  # Deploy is a separate job so the build runs with a read-only token and only this job holds the
  # Pages permissions. The `github-pages` environment is what GitHub's Pages source expects.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
